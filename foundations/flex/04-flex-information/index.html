  <!-- Level A div: "all" Container mit allem (-> ANFANG A)-->
   <div class="all">

        <!-- ENDE: Level C: -->
        </div>

        <!-- ENDE: Level D: -->
        </div>

        <img src="./images/pepper.png" alt="pepper">

        <!-- ENDE: Level E: -->
        </div>

        <!-- Level F div wird dieser mit Bild&Text vom 1.Element (-> "plant-box") -->

        </div>
